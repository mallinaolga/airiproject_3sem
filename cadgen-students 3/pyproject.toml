[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgen"
description = "Library for CAD generation"
readme = "README.md"
authors = [{ name = "Antonio Rodrigues", email = "axtonio.code@gmail.com" }]
dependencies = [
	"cadquery==2.5.2",
	"numpy",
	"scipy",
	"trimesh",
	"hydra-core>=1.3,<2",
	"omegaconf>=2.3,<3",
	"typer>=0.12",
	"natsort",
	"tqdm",
]
requires-python = ">=3.11"
dynamic = ["version"]

[project.urls]
GitHub = "ssh://github.com/axtonio/cadgen"

[tool.setuptools.packages.find]
where = ["."]
include = ["cadgen*", "generirovanie_pazov*"]

[tool.setuptools]
py-modules = ["Bolty", "Gaiki", "Otverstiya"]

[tool.setuptools.dynamic]
version = { attr = "cadgen.__version__" }

[project.optional-dependencies]
test = ["pytest", "pytest-repeat"]
defects = ["open3d", "psutil"]

[project.scripts]
cadgen = "cadgen.cli:app"
